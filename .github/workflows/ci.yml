name: CI & Container Release Pipeline

on:
  push:
    branches: [ "main", "feat/**", "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  VERSION: "1.0.0"

jobs:
  test:
    name: Unit, Scenario, and Interoperability Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.12" ]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Test Suite
        run: python -m pytest -v tests/

      - name: Run Performance Benchmark (Sample)
        run: python scripts/benchmark.py --warmup 1 --runs 5 --out benchmark_summary.md

  build-and-publish:
    name: Build & Publish Container Image (linux/amd64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: ref
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/norasign" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.ref.outputs.image }}:${{ env.VERSION }}
            ${{ steps.ref.outputs.image }}:sha-${{ github.sha }}

      - name: Record image identity
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Release image"
            echo "- Version tag: \`${VERSION}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.build-push.outputs.digest }}\`"
            echo "- Pin: \`${{ steps.ref.outputs.image }}@${{ steps.build-push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  consumer-release-pipeline:
    name: Consumer Pipeline Integration (C01 - C05)
    needs: build-and-publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build-and-publish.outputs.image }}@${{ needs.build-and-publish.outputs.digest }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Pull release image by digest (no credentials)
        run: docker pull "$IMAGE"

      - name: Run scenarios C01 - C05
        run: bash scripts/run_ci_scenarios.sh "$IMAGE" ci-evidence

      - name: Publish evidence summary
        if: always()
        run: |
          {
            echo "### Integration scenarios"
            echo "Image: \`${IMAGE}\`"
            echo
            cat ci-evidence/summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: ci-evidence/
