name: CI & Container Release Pipeline

on:
  push:
    branches: [ "main", "feat/*", "feature/*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/norasign

jobs:
  test:
    name: Unit & Interoperability Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Test Suite
        run: |
          python -m pytest -v tests/

      - name: Run Performance Benchmark (Sample)
        run: |
          python scripts/benchmark.py --warmup 1 --runs 5 --out benchmark_summary.md

  build-and-publish:
    name: Build & Publish Container Image (linux/amd64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
      image_ref: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=1.0.0
            type=sha,format=short

      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print Image Digest
        run: |
          echo "Published Image Digest: ${{ steps.build-push.outputs.digest }}"

  consumer-release-pipeline:
    name: Consumer Pipeline Integration (C01 - C05)
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Prepare Test Workspace
        run: |
          mkdir -p dist out ci keys
          # Create sample release artifact
          echo "NoraSign Release Artifact Build Output" > dist/sample-app.tar.gz

      - name: Generate Ephemeral Test Signing Key
        run: |
          # Create test signing keypair
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/keys:/keys" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.0.0 keygen \
            --algorithm ed25519 --out /keys/ephemeral_signer

      - name: Run CI Signing Stage (Table 2.14)
        run: |
          export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-publish.outputs.image_digest }}"
          export SIGNING_KEY_FILE="$PWD/keys/ephemeral_signer.key.pem"
          trap 'rm -f "$SIGNING_KEY_FILE"' 0

          # Execute sign inside container with --network none and runner user UID:GID
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/dist:/input:ro" \
            -v "$PWD/out:/output" \
            -v "$SIGNING_KEY_FILE:/run/signing.key.pem:ro" \
            "$IMAGE" sign \
            --file /input/sample-app.tar.gz \
            --package sample-app \
            --version 1.0.0 \
            --key /run/signing.key.pem \
            --out /output/release.bundle.json

          # Verify bundle was generated
          test -f out/release.bundle.json
          echo "Artifact and bundle successfully created."
